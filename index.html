<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Schijndel Events | Hub</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11111f;
    }

    #hubFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #11111f;
    }
  </style>
</head>

<body>

  <iframe
    id="hubFrame"
    title="Schijndel Events | Hub"
    allow="geolocation"
  ></iframe>

<script>
  const BASE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx273k5nju4DDNyr4L9yeoRcglSJko--56NQKtclqtK1wglo3kO7vokIJlorR_KU4HF0A/exec";

  const hubFrame = document.getElementById("hubFrame");

  function maakScriptUrl(pagina, token) {
    const url = new URL(BASE_SCRIPT_URL);

    if (token) {
      url.searchParams.set("t", token);
    }

    url.searchParams.set("page", pagina || "home");

    return url.toString();
  }


  // =========================================================
  // 1. EERSTE KEER OPENEN
  // =========================================================

  const eersteParams =
    new URLSearchParams(window.location.search);

  const eersteToken =
    eersteParams.get("t") || "";

  const eerstePagina =
    eersteParams.get("page") || "home";

  hubFrame.src =
    maakScriptUrl(eerstePagina, eersteToken);


  // =========================================================
  // 2. NAVIGATIE VANUIT APPS SCRIPT
  // =========================================================

  window.addEventListener("message", function(event) {

    if (!event.data) return;

    if (event.data.type !== "SCHIJNDEL_NAVIGATE") {
      return;
    }

    const pagina = event.data.page;
    const token = event.data.token;
    const scriptUrl = event.data.url;

    if (!pagina || !token) {
      return;
    }

    // Gebruik rechtstreeks de URL die Apps Script heeft gemaakt.
    // Alleen terugvallen op zelf opbouwen als die ontbreekt.
    hubFrame.src =
      scriptUrl || maakScriptUrl(pagina, token);


    // Alleen het zichtbare GitHub-adres aanpassen.
    const githubUrl =
      new URL(window.location.href);

    githubUrl.searchParams.set("t", token);
    githubUrl.searchParams.set("page", pagina);

    window.history.pushState(
      {
        page: pagina,
        token: token
      },
      "",
      githubUrl.toString()
    );
  });


  // =========================================================
  // 3. TERUG / VOORUIT IN BROWSER
  // =========================================================

  window.addEventListener("popstate", function() {

    const params =
      new URLSearchParams(window.location.search);

    const token =
      params.get("t") || "";

    const pagina =
      params.get("page") || "home";

    hubFrame.src =
      maakScriptUrl(pagina, token);
  });
</script>
