<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

    <title>Schijndel Events</title>
<meta name="apple-mobile-web-app-title" content="Schijndel Events">
  
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11111f;
    }

    #hubFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #11111f;
    }
  </style>
</head>

<body>

  <iframe
    id="hubFrame"
    title="Schijndel Events | Hub"
    allow="geolocation"
  ></iframe>

<script>
  const BASE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx273k5nju4DDNyr4L9yeoRcglSJko--56NQKtclqtK1wglo3kO7vokIJlorR_KU4HF0A/exec";

  const hubFrame = document.getElementById("hubFrame");

  function maakScriptUrl(pagina, token) {
    const url = new URL(BASE_SCRIPT_URL);

    if (token) {
      url.searchParams.set("t", token);
    }

    url.searchParams.set("page", pagina || "home");

    return url.toString();
  }


  // =========================================================
  // 1. EERSTE KEER OPENEN
  // =========================================================

  const eersteParams =
    new URLSearchParams(window.location.search);

  const eersteToken =
    eersteParams.get("t") || "";

  const eerstePagina =
    eersteParams.get("page") || "home";

  hubFrame.src =
    maakScriptUrl(eerstePagina, eersteToken);


  // =========================================================
  // 2. NAVIGATIE VANUIT APPS SCRIPT
  // =========================================================

  window.addEventListener("message", function(event) {

    if (!event.data) return;


    // =====================================================
    // SNELLE INTERNE PAGINAWISSEL
    // Alleen GitHub-URL aanpassen.
    // De iframe wordt NIET opnieuw geladen.
    // =====================================================

    if (event.data.type === "SCHIJNDEL_HISTORY") {

      const pagina = event.data.page;
      const nieuwToken = event.data.token;

      if (!pagina || !nieuwToken) {
        return;
      }

      const githubUrl =
        new URL(window.location.href);

      githubUrl.searchParams.set("t", nieuwToken);
      githubUrl.searchParams.set("page", pagina);

      window.history.pushState(
        {
          page: pagina,
          token: nieuwToken
        },
        "",
        githubUrl.toString()
      );

      return;
    }


    // =====================================================
    // NORMALE NAVIGATIE
    // Alleen gebruikt voor pagina's die nog niet intern zijn.
    // =====================================================

    if (event.data.type !== "SCHIJNDEL_NAVIGATE") {
      return;
    }

    const pagina = event.data.page;
const nieuwToken = event.data.token;

if (!pagina || !nieuwToken) {
  return;
}

// GitHub bepaalt altijd zelf welke Apps Script-pagina
// in de iframe geopend moet worden.
hubFrame.src =
  maakScriptUrl(pagina, nieuwToken);


    // Alleen het zichtbare GitHub-adres aanpassen.
    const githubUrl =
      new URL(window.location.href);

    githubUrl.searchParams.set("t", nieuwToken);
githubUrl.searchParams.set("page", pagina);

window.history.pushState(
  {
    page: pagina,
    token: nieuwToken
  },
      "",
      githubUrl.toString()
    );
  });


  // =========================================================
  // 3. TERUG / VOORUIT IN BROWSER
  // =========================================================

  window.addEventListener("popstate", function() {

    const params =
      new URLSearchParams(window.location.search);

    const token =
      params.get("t") || "";

    const pagina =
      params.get("page") || "home";

    hubFrame.src =
      maakScriptUrl(pagina, token);
  });
</script>
