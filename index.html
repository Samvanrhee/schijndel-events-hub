<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Schijndel Events</title>
  <meta name="apple-mobile-web-app-title" content="Schijndel Events">

  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11111f;
    }

    #hubFrame {
      position: fixed;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #11111f;
    }

    #pushActivateButton[hidden] {
      display: none !important;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
</head>

<body>

  <iframe
    id="hubFrame"
    title="Schijndel Events | Hub"
    allow="geolocation"
  ></iframe>

<script>
  const BASE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx273k5nju4DDNyr4L9yeoRcglSJko--56NQKtclqtK1wglo3kO7vokIJlorR_KU4HF0A/exec";

  const hubFrame = document.getElementById("hubFrame");

  function maakScriptUrl(pagina, token) {
    const url = new URL(BASE_SCRIPT_URL);

    if (token) {
      url.searchParams.set("t", token);
    }

    url.searchParams.set("page", pagina || "home");

    return url.toString();
  }

  // =========================================================
  // 1. EERSTE KEER OPENEN
  // =========================================================

  const eersteParams =
    new URLSearchParams(window.location.search);

  const eersteToken =
    eersteParams.get("t") || "";

  const eerstePagina =
    eersteParams.get("page") || "home";

  hubFrame.src =
    maakScriptUrl(eerstePagina, eersteToken);

  // =========================================================
  // 2. NAVIGATIE VANUIT APPS SCRIPT
  // =========================================================

  window.addEventListener("message", function(event) {

    if (!event.data) return;

    if (event.data.type === "SCHIJNDEL_HISTORY") {

      const pagina = event.data.page;
      const nieuwToken = event.data.token;

      if (!pagina || !nieuwToken) {
        return;
      }

      const githubUrl =
        new URL(window.location.href);

      githubUrl.searchParams.set("t", nieuwToken);
      githubUrl.searchParams.set("page", pagina);

      window.history.pushState(
        {
          page: pagina,
          token: nieuwToken
        },
        "",
        githubUrl.toString()
      );

      return;
    }

    if (event.data.type !== "SCHIJNDEL_NAVIGATE") {
      return;
    }

    const pagina = event.data.page;
    const nieuwToken = event.data.token;

    if (!pagina || !nieuwToken) {
      return;
    }

    hubFrame.src =
      maakScriptUrl(pagina, nieuwToken);

    const githubUrl =
      new URL(window.location.href);

    githubUrl.searchParams.set("t", nieuwToken);
    githubUrl.searchParams.set("page", pagina);

    window.history.pushState(
      {
        page: pagina,
        token: nieuwToken
      },
      "",
      githubUrl.toString()
    );
  });

  // =========================================================
  // 3. TERUG / VOORUIT IN BROWSER
  // =========================================================

  window.addEventListener("popstate", function() {

    const params =
      new URLSearchParams(window.location.search);

    const token =
      params.get("t") || "";

    const pagina =
      params.get("page") || "home";

    hubFrame.src =
      maakScriptUrl(pagina, token);
  });

  // =========================================================
  // 4. FIREBASE PUSH - SERVICE WORKER REGISTRATIE
  // =========================================================

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async function() {
      try {
        const registration = await navigator.serviceWorker.register(
          "./firebase-messaging-sw.js",
          {
            scope: "./"
          }
        );

        console.log(
          "Schijndel Events push-serviceworker geregistreerd:",
          registration.scope
        );

      } catch (error) {
        console.error(
          "Schijndel Events push-serviceworker fout:",
          error
        );
      }
    });
  }
</script>

<div
  id="pushPopup"
  hidden
  style="
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(17,17,31,0.65);
  "
>
  <div style="
    width:100%;
    max-width:360px;
    padding:28px 24px;
    border-radius:22px;
    background:#ffffff;
    color:#11111f;
    font-family:Arial,sans-serif;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
  ">
    
    <div style="
      font-size:21px;
      font-weight:800;
      margin-bottom:12px;
    ">
      Pushmeldingen inschakelen
    </div>

    <p style="
      font-size:14px;
      line-height:1.6;
      color:#596273;
      margin-bottom:24px;
    ">
      Ontvang belangrijke Crew-informatie,
      roosterwijzigingen en noodmeldingen
      rechtstreeks op je telefoon.
    </p>

    <button
      id="pushActivateButton"
      type="button"
      hidden
      style="
        width:100%;
        padding:15px;
        border:0;
        border-radius:13px;
        background:#65cedb;
        color:#11111f;
        font-size:15px;
        font-weight:800;
        cursor:pointer;
      "
    >
      Toestemming geven
    </button>

    <button
      id="pushPopupClose"
      type="button"
      style="
        margin-top:15px;
        padding:10px;
        border:0;
        background:transparent;
        color:#596273;
        font-size:14px;
        cursor:pointer;
      "
    >
      Annuleren
    </button>
  </div>
</div>

<script>
  // =========================================================
  // SCHIJNDEL EVENTS | PUSHMELDINGEN
  // =========================================================
const SCHIJNDEL_VAPID_KEY =
  "BB-_sU9ELo4DjYEvan1q3oHVliXewJjcphH4AnFGaRLTHDci7c6eT88JUujZ2s916JyJ8mk2x1-TGcnWrMaySj8";
firebase.initializeApp({
  apiKey: "AIzaSyCP9_UB0U-LNSxR8b_RtuVpdV9dUlvUE7k",
  authDomain: "schijndel-events-hub-6bc6a.firebaseapp.com",
  projectId: "schijndel-events-hub-6bc6a",
  storageBucket: "schijndel-events-hub-6bc6a.firebasestorage.app",
  messagingSenderId: "909465507127",
  appId: "1:909465507127:web:b01c1cf1040c63b7f136b2"
});

const schijndelMessaging = firebase.messaging();
async function schijndelBestaandePushToken() {
  if (
    !("Notification" in window) ||
    Notification.permission !== "granted"
  ) {
    return null;
  }

  const actief = localStorage.getItem("SCHIJNDEL_PUSH_ACTIEF");

  if (actief !== "JA") return null;

  const token = await schijndelPushTokenOphalen();

if (token) {
  const vorigToken = localStorage.getItem("SCHIJNDEL_FCM_TOKEN");

  if (vorigToken !== token) {
    localStorage.setItem("SCHIJNDEL_FCM_TOKEN", token);
  }
}

return token;
}  
async function schijndelPushTokenOphalen() {
  if (!("Notification" in window) ||
      Notification.permission !== "granted") {
    return null;
  }

  const registration = await navigator.serviceWorker.ready;

  const token = await schijndelMessaging.getToken({
    vapidKey: SCHIJNDEL_VAPID_KEY,
    serviceWorkerRegistration: registration
  });

  return token || null;
}


async function schijndelPushTokenVerwijderen() {
  try {
    const verwijderd = await schijndelMessaging.deleteToken();

    if (verwijderd) {
      console.log("Schijndel Events: pushregistratie verwijderd.");
    }

    return verwijderd;
  } catch (error) {
    console.error("Pushregistratie verwijderen mislukt:", error);
    return false;
  }
}

  const pushActivateButton =
    document.getElementById("pushActivateButton");
  
const pushPopup = document.getElementById("pushPopup");
const pushPopupClose = document.getElementById("pushPopupClose");

function schijndelPushPopupOpenen() {
  if (!pushPopup || !pushActivateButton) return;

  pushPopup.hidden = false;
  pushPopup.style.display = "flex";
  pushActivateButton.hidden = false;
}

function schijndelPushPopupSluiten() {
  if (!pushPopup) return;

  pushPopup.style.display = "none";
  pushPopup.hidden = true;
}

if (pushPopupClose) {
  pushPopupClose.addEventListener("click", schijndelPushPopupSluiten);
}


  let pushAanvraagVenster = null;
  let pushAanvraagOrigin = null;

  function schijndelPushToegestaanAfzender(event) {
    return (
      event.origin === "https://script.google.com" ||
      /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin)
    );
  }

  function schijndelPushStatusVerzenden(venster, origin) {
    if (!venster || !origin) return;

    const permission = ("Notification" in window)
      ? Notification.permission
      : "unsupported";

    venster.postMessage({
      type: "SCHIJNDEL_PUSH_STATUS",
      permission: permission
    }, origin);
  }

  // Ontvang berichten vanuit Apps Script.
  window.addEventListener("message", async function(event) {

    if (!schijndelPushToegestaanAfzender(event)) return;
    if (!event.data || !event.data.type) return;

    if (event.data.type === "SCHIJNDEL_PUSH_CHECK") {
  schijndelPushStatusVerzenden(event.source, event.origin);

  if (
    "Notification" in window &&
    Notification.permission === "granted"
  ) {
    try {
      const fcmToken = await schijndelBestaandePushToken();

      event.source.postMessage({
        type: "SCHIJNDEL_PUSH_CHECK_TOKEN",
        fcmToken: fcmToken
      }, event.origin);

    } catch (error) {
      console.error("Pushstatus controleren mislukt:", error);

      event.source.postMessage({
        type: "SCHIJNDEL_PUSH_CHECK_TOKEN",
        fcmToken: null
      }, event.origin);
    }
  }

  return;
}
if (event.data.type === "SCHIJNDEL_PUSH_DISABLE") {
  try {
    const fcmToken = await schijndelPushTokenOphalen();

    event.source.postMessage({
      type: "SCHIJNDEL_PUSH_UNREGISTER",
      fcmToken: fcmToken
    }, event.origin);

  } catch (error) {
    console.error("Push uitschakelen voorbereiden mislukt:", error);

    event.source.postMessage({
      type: "SCHIJNDEL_PUSH_DISABLED",
      success: false
    }, event.origin);
  }

  
schijndelPushPopupSluiten();
pushActivateButton.hidden = true;
return;

}
    
if (event.data.type === "SCHIJNDEL_PUSH_REGISTERED") {
  localStorage.setItem("SCHIJNDEL_PUSH_ACTIEF", "JA");
  schijndelPushPopupSluiten();
  return;
}

    if (event.data.type === "SCHIJNDEL_PUSH_DELETE_CONFIRMED") {
  const verwijderd = await schijndelPushTokenVerwijderen();

localStorage.setItem("SCHIJNDEL_PUSH_ACTIEF", "NEE");

  event.source.postMessage({
    type: "SCHIJNDEL_PUSH_DISABLED",
    success: verwijderd
  }, event.origin);

  return;
}
    if (event.data.type !== "SCHIJNDEL_PUSH_ENABLE") return;

    pushAanvraagVenster = event.source;
    pushAanvraagOrigin = event.origin;

    if (
  "Notification" in window &&
  Notification.permission === "granted"
) {
  pushActivateButton.hidden = true;

  try {
    const fcmToken = await schijndelPushTokenOphalen();

    event.source.postMessage({
      type: "SCHIJNDEL_PUSH_TOKEN",
      fcmToken: fcmToken
    }, event.origin);

  } catch (error) {
  console.error("FCM-token ophalen mislukt:", error);

  event.source.postMessage({
    type: "SCHIJNDEL_PUSH_TOKEN",
    fcmToken: null,
    foutmelding: String(error.message || error)
  }, event.origin);
}


} else {
  schijndelPushPopupOpenen();
}

  });

  // De turquoise knop vraagt toestemming aan.
  pushActivateButton.addEventListener("click", async function() {

    if (!("Notification" in window)) {
      alert("Dit apparaat ondersteunt geen browsermeldingen.");

      schijndelPushStatusVerzenden(
        pushAanvraagVenster,
        pushAanvraagOrigin
      );

      return;
    }

    try {
      const permission = await Notification.requestPermission();

      
if (permission === "granted") {
  schijndelPushPopupSluiten();
  pushActivateButton.hidden = true;


  try {
    const fcmToken = await schijndelPushTokenOphalen();

    if (!fcmToken) {
      throw new Error("Geen Firebase-token ontvangen.");
    }

    if (pushAanvraagVenster && pushAanvraagOrigin) {
      pushAanvraagVenster.postMessage({
        type: "SCHIJNDEL_PUSH_TOKEN",
        fcmToken: fcmToken
      }, pushAanvraagOrigin);
    }

  } catch (error) {
    console.error("Pushregistratie mislukt:", error);
    alert("Pushregistratie is niet gelukt.");
  }
}

      // Werk de tekst in Apps Script direct bij.
      schijndelPushStatusVerzenden(
        pushAanvraagVenster,
        pushAanvraagOrigin
      );

      if (permission !== "granted") {
  alert("Meldingstoestemming is niet gegeven.");
}

    } catch (error) {
      console.error("Pushmelding toestemming mislukt:", error);
      alert("Het aanvragen van meldingstoestemming is mislukt.");
    }
  });
</script>

</body>
</html>
