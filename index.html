
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Schijndel Events</title>
  <meta name="apple-mobile-web-app-title" content="Schijndel Events">

  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11111f;
    }

        #hubFrame {
      position: fixed;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #11111f;
    }

    #pushActivateButton[hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <iframe
    id="hubFrame"
    title="Schijndel Events | Hub"
    allow="geolocation"
  ></iframe>

<script>
  const BASE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx273k5nju4DDNyr4L9yeoRcglSJko--56NQKtclqtK1wglo3kO7vokIJlorR_KU4HF0A/exec";

  const hubFrame = document.getElementById("hubFrame");

  function maakScriptUrl(pagina, token) {
    const url = new URL(BASE_SCRIPT_URL);

    if (token) {
      url.searchParams.set("t", token);
    }

    url.searchParams.set("page", pagina || "home");

    return url.toString();
  }

  // =========================================================
  // 1. EERSTE KEER OPENEN
  // =========================================================

  const eersteParams =
    new URLSearchParams(window.location.search);

  const eersteToken =
    eersteParams.get("t") || "";

  const eerstePagina =
    eersteParams.get("page") || "home";

  hubFrame.src =
    maakScriptUrl(eerstePagina, eersteToken);

  // =========================================================
  // 2. NAVIGATIE VANUIT APPS SCRIPT
  // =========================================================

  window.addEventListener("message", function(event) {

    if (!event.data) return;

    if (event.data.type === "SCHIJNDEL_HISTORY") {

      const pagina = event.data.page;
      const nieuwToken = event.data.token;

      if (!pagina || !nieuwToken) {
        return;
      }

      const githubUrl =
        new URL(window.location.href);

      githubUrl.searchParams.set("t", nieuwToken);
      githubUrl.searchParams.set("page", pagina);

      window.history.pushState(
        {
          page: pagina,
          token: nieuwToken
        },
        "",
        githubUrl.toString()
      );

      return;
    }

    if (event.data.type !== "SCHIJNDEL_NAVIGATE") {
      return;
    }

    const pagina = event.data.page;
    const nieuwToken = event.data.token;

    if (!pagina || !nieuwToken) {
      return;
    }

    hubFrame.src =
      maakScriptUrl(pagina, nieuwToken);

    const githubUrl =
      new URL(window.location.href);

    githubUrl.searchParams.set("t", nieuwToken);
    githubUrl.searchParams.set("page", pagina);

    window.history.pushState(
      {
        page: pagina,
        token: nieuwToken
      },
      "",
      githubUrl.toString()
    );
  });

  // =========================================================
  // 3. TERUG / VOORUIT IN BROWSER
  // =========================================================

  window.addEventListener("popstate", function() {

    const params =
      new URLSearchParams(window.location.search);

    const token =
      params.get("t") || "";

    const pagina =
      params.get("page") || "home";

    hubFrame.src =
      maakScriptUrl(pagina, token);
  });

  // =========================================================
  // 4. FIREBASE PUSH - SERVICE WORKER REGISTRATIE
  // =========================================================

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async function() {
      try {
        const registration = await navigator.serviceWorker.register(
          "./firebase-messaging-sw.js",
          {
            scope: "./"
          }
        );

        console.log(
          "Schijndel Events push-serviceworker geregistreerd:",
          registration.scope
        );

      } catch (error) {
        console.error(
          "Schijndel Events push-serviceworker fout:",
          error
        );
      }
    });
  }
</script>

<button
  id="pushActivateButton"
  type="button"
  hidden
  style="
    position:fixed;
    z-index:99999;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    padding:14px 22px;
    border:0;
    border-radius:14px;
    background:#65cedb;
    color:#11111f;
    font:600 16px Arial,sans-serif;
    cursor:pointer;
  "
>
  Pushmeldingen inschakelen
</button>

<script>
  // =========================================================
  // SCHIJNDEL EVENTS | PUSHMELDINGEN
  // Toon de activatieknop vanuit de Apps Script Hub
  // =========================================================

  
<script>
  // =========================================================
  // SCHIJNDEL EVENTS | PUSHMELDINGEN
  // =========================================================

  const pushActivateButton =
    document.getElementById("pushActivateButton");

  let pushAanvraagVenster = null;
  let pushAanvraagOrigin = null;

  function schijndelPushToegestaanAfzender(event) {
    return (
      event.origin === "https://script.google.com" ||
      /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin)
    );
  }

  function schijndelPushStatusVerzenden(venster, origin) {
    if (!venster || !origin) return;

    const permission = ("Notification" in window)
      ? Notification.permission
      : "unsupported";

    venster.postMessage({
      type: "SCHIJNDEL_PUSH_STATUS",
      permission: permission
    }, origin);
  }

  // Ontvang berichten vanuit Apps Script.
  window.addEventListener("message", function(event) {
    if (!schijndelPushToegestaanAfzender(event)) return;
    if (!event.data || !event.data.type) return;

    if (event.data.type === "SCHIJNDEL_PUSH_CHECK") {

  const permission = ("Notification" in window)
    ? Notification.permission
    : "unsupported";

  const bericht = {
    type: "SCHIJNDEL_PUSH_STATUS",
    permission: permission
  };

  // Antwoord direct aan de aanvrager.
  if (event.source) {
    event.source.postMessage(bericht, event.origin);
  }

  // Informeer ook de Apps Script-iframe.
  if (hubFrame.contentWindow &&
      hubFrame.contentWindow !== event.source) {
    hubFrame.contentWindow.postMessage(bericht, "*");
  }

  return;
}

    if (event.data.type !== "SCHIJNDEL_PUSH_ENABLE") return;

    pushAanvraagVenster = event.source;
    pushAanvraagOrigin = event.origin;

    if (
      "Notification" in window &&
      Notification.permission === "granted"
    ) {
      pushActivateButton.hidden = true;
      schijndelPushStatusVerzenden(
        pushAanvraagVenster,
        pushAanvraagOrigin
      );
    } else {
      pushActivateButton.hidden = false;
    }
  });

  // De turquoise knop vraagt toestemming aan.
  pushActivateButton.addEventListener("click", async function() {
    if (!("Notification" in window)) {
      alert("Dit apparaat ondersteunt geen browsermeldingen.");
      schijndelPushStatusVerzenden(
        pushAanvraagVenster,
        pushAanvraagOrigin
      );
      return;
    }

    try {
      const permission = await Notification.requestPermission();

      if (permission === "granted") {
        pushActivateButton.hidden = true;
      }

      // Werk de tekst in Apps Script direct bij.
      schijndelPushStatusVerzenden(
        pushAanvraagVenster,
        pushAanvraagOrigin
      );

      if (permission === "granted") {
        alert("Toestemming voor meldingen is gegeven.");
      } else {
        alert("Meldingstoestemming is niet gegeven.");
      }
    } catch (error) {
      console.error("Pushmelding toestemming mislukt:", error);
      alert("Het aanvragen van meldingstoestemming is mislukt.");
    }
  });
</script>

</body>
</html>
