<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Schijndel Events | Hub</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11111f;
    }

    #hubFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #11111f;
    }
  </style>
</head>

<body>

  <iframe
    id="hubFrame"
    title="Schijndel Events | Hub"
    allow="geolocation"
  ></iframe>

  <script>
    const BASE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx273k5nju4DDNyr4L9yeoRcglSJko--56NQKtclqtK1wglo3kO7vokIJlorR_KU4HF0A/exec";

    const hubFrame = document.getElementById("hubFrame");

    // Parameters van GitHub doorgeven bij eerste keer openen.
    const params = new URLSearchParams(window.location.search);
    const firstUrl = new URL(BASE_SCRIPT_URL);

    params.forEach((value, key) => {
      firstUrl.searchParams.set(key, value);
    });

    // Apps Script in iframe openen.
    hubFrame.src = firstUrl.toString();

    // Navigatie vanuit Apps Script ontvangen.
    window.addEventListener("message", function(event) {

      if (!event.data) return;
      if (event.data.type !== "SCHIJNDEL_NAVIGATE") return;

      const page = event.data.page;
      const token = event.data.token;

      if (!page || !token) return;

      // Nieuwe Apps Script-pagina MAAR binnen iframe.
      const nextUrl = new URL(BASE_SCRIPT_URL);

      nextUrl.searchParams.set("t", token);
      nextUrl.searchParams.set("page", page);

      hubFrame.src = nextUrl.toString();

      // GitHub-adres aanpassen zonder pagina opnieuw te laden.
      const githubUrl = new URL(window.location.href);

      githubUrl.searchParams.set("t", token);
      githubUrl.searchParams.set("page", page);

      window.history.replaceState(
        {},
        "",
        githubUrl.toString()
      );
    });
  </script>

</body>
</html>
