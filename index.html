<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Schijndel Events | Hub</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11111f;
    }

    #hubFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #11111f;
    }
  </style>
</head>

<body>

  <iframe
    id="hubFrame"
    title="Schijndel Events | Hub"
    allow="geolocation"
  ></iframe>

  <script>
    const BASE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx273k5nju4DDNyr4L9yeoRcglSJko--56NQKtclqtK1wglo3kO7vokIJlorR_KU4HF0A/exec";

    const params = new URLSearchParams(window.location.search);

    const hubUrl = new URL(BASE_SCRIPT_URL);

    params.forEach((value, key) => {
      hubUrl.searchParams.set(key, value);
    });

    document.getElementById("hubFrame").src = hubUrl.toString();
    window.addEventListener("message", function(event) {
  if (event.data?.type !== "SCHIJNDEL_NAVIGATE") return;

  const page = event.data.page;
  const token = event.data.token;

  if (!page || !token) return;

  const nextUrl = new URL(BASE_SCRIPT_URL);
  nextUrl.searchParams.set("t", token);
  nextUrl.searchParams.set("page", page);

  document.getElementById("hubFrame").src = nextUrl.toString();

  const browserUrl = new URL(window.location.href);
  browserUrl.searchParams.set("t", token);
  browserUrl.searchParams.set("page", page);

  window.history.replaceState({}, "", browserUrl.toString());
});
  </script>

</body>
</html>
