<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Schijndel Events | Hub</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #11111f;
    }

    #hubFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #11111f;
    }
  </style>
</head>

<body>

  <iframe
    id="hubFrame"
    title="Schijndel Events | Hub"
    allow="geolocation"
  ></iframe>

 <script>
  const BASE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx273k5nju4DDNyr4L9yeoRcglSJko--56NQKtclqtK1wglo3kO7vokIJlorR_KU4HF0A/exec";

  const hubFrame = document.getElementById("hubFrame");

  const params = new URLSearchParams(window.location.search);

  const token = params.get("t") || "";
  const page = params.get("page") || "home";

  function laadPagina(pagina, replaceHistory = false) {

    const scriptUrl = new URL(BASE_SCRIPT_URL);

    if (token) {
      scriptUrl.searchParams.set("t", token);
    }

    scriptUrl.searchParams.set("page", pagina);

    hubFrame.src = scriptUrl.toString();

    const githubUrl = new URL(window.location.href);

    if (token) {
      githubUrl.searchParams.set("t", token);
    }

    githubUrl.searchParams.set("page", pagina);

    if (replaceHistory) {
      window.history.replaceState(
        { page: pagina },
        "",
        githubUrl.toString()
      );
    } else {
      window.history.pushState(
        { page: pagina },
        "",
        githubUrl.toString()
      );
    }
  }

  // Eerste pagina laden
  laadPagina(page, true);


  // Navigatie vanuit Apps Script
  window.addEventListener("message", function(event) {

    if (!event.data) return;

    if (event.data.type !== "SCHIJNDEL_NAVIGATE") {
      return;
    }

    const nieuwePagina = event.data.page;

    if (!nieuwePagina) return;

    laadPagina(nieuwePagina);
  });


  // Browser terug / vooruit
  window.addEventListener("popstate", function() {

    const params =
      new URLSearchParams(window.location.search);

    const pagina =
      params.get("page") || "home";

    laadPagina(pagina, true);
  });
</script>
